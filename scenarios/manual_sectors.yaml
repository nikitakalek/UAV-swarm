# M2-13: сектора размечены пользователем вручную (вместо автоматического разбиения).
schema_version: 1
name: manual_sectors
dt: 0.5
t_end: 3600
world:
  size: [1000, 1000]
  nofly:
    - [[450, 450], [550, 450], [550, 550], [450, 550]]
  targets: {count: 20}
agents: {count: 4}
