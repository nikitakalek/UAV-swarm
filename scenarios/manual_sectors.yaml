    - id: se
      polygon: [[600, 0], [1000, 0], [1000, 500], [550, 500], [550, 450], [450, 450]]
      agents: [1]
    - id: ne
      polygon: [[550, 500], [1000, 500], [1000, 1000], [400, 1000], [550, 550]]
      agents: [2]
    - id: nw
      polygon: [[0, 450], [450, 450], [450, 550], [550, 550], [400, 1000], [0, 1000]]
      agents: [3]
allocator: {name: manual_sectors}
events:
  - {t: 200, type: agent_failure, agent: 2}
